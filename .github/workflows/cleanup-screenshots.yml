name: Cleanup screenshots

"on":
    pull_request:
        types: ["closed"]

permissions:
    contents: write

jobs:
    cleanup:
        name: Delete the visual regressions branch
        runs-on: ubuntu-latest
        steps:
            # Fails when there is no branch to delete. Keep in sync with clear_visual_regressions_report() in .castor/qa.php
            - run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/ci-screenshots/pr-${{ github.event.pull_request.number }}" || true
              env:
                  GH_TOKEN: ${{ github.token }}

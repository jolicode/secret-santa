name: Continuous Integration

"on":
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * MON"

permissions:
    contents: read

# Two runs of a pull request must not race on its visual regressions report
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

env:
    # Fix for symfony/color detection. We know GitHub Actions can handle it
    ANSICON: 1
    CASTOR_CONTEXT: ci

jobs:
    check-dockerfiles:
        name: Check Dockerfile
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Check php/Dockerfile
              uses: hadolint/hadolint-action@v3.1.0
              with:
                  dockerfile: infrastructure/docker/services/php/Dockerfile

    ci:
        name: Continuous Integration
        runs-on: ubuntu-latest
        permissions:
            # The visual regressions report: a branch of images and a comment on the pull request
            contents: write
            pull-requests: write
        env:
            BUILDKIT_PROGRESS: plain
            CI: 1
        steps:
            - uses: actions/checkout@v4

            - name: Setup Castor
              uses: castor-php/setup-castor@v1.1.0

            - name: Cache Playwright browsers
              uses: actions/cache@v4
              with:
                  path: .home/.cache/ms-playwright
                  key: playwright-${{ hashFiles('composer.lock') }}

            - name: "Build and start the infrastructure"
              run: "castor start && sleep 5"

            - name: "Test HTTP server"
              run: |
                  set -e
                  set -o pipefail

                  curl --fail --insecure --silent -H "Host: secret-santa.test" https://127.0.0.1 | grep "Secret Santa"

            - name: "Run PHPUnit"
              run: castor qa:phpunit

            - name: "Upload the screenshots and visual diffs of the failed E2E tests"
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: test-failures
                  path: test-failures/
                  if-no-files-found: ignore

            - name: "Report the visual regressions on the pull request"
              # The token of a pull request from a fork is read-only
              if: failure() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              env:
                  GH_TOKEN: ${{ github.token }}
              run: castor qa:report-visual-regressions ${{ github.event.pull_request.number }}

            - name: "Remove the visual regressions report from the pull request"
              if: success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              env:
                  GH_TOKEN: ${{ github.token }}
              run: castor qa:clear-visual-regressions-report ${{ github.event.pull_request.number }}

            - name: "Run PHPStan"
              run: castor qa:phpstan

            - name: "Run PHP-CS-Fixer"
              run: castor qa:cs --dry-run

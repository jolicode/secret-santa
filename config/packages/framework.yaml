# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    #csrf_protection: true
    http_method_override: false
    trusted_proxies: '%env(TRUSTED_PROXIES)%'

    # Enables session support. Note that the session will ONLY be started if you read or write from it.
    # Remove or comment this section to explicitly disable session support.
    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\RedisSessionHandler
        name: santaSession
        cookie_secure: auto
        cookie_samesite: lax
        storage_factory_id: session.storage.factory.native
        # 3h long session (this value is looked up by Predis too)
        gc_maxlifetime: 10800 # 3H

    #esi: true
    #fragments: true
    php_errors:
        log: true

    http_client:
        default_options:
            headers:
                User-Agent: "secret-santa.team"
            retry_failed:
                enabled: true

when@test:
    framework:
        test: true
        session:
            name: MOCKSESSID
            storage_factory_id: test.session.storage.factory.mock_file
        http_client:
            mock_response_factory: JoliCode\SecretSanta\Tests\Fake\FakeChatApiDispatcher

    services:
        JoliCode\SecretSanta\Tests\Fake\FakeSlackApi:
            public: true
        JoliCode\SecretSanta\Tests\Fake\FakeDiscordApi:
            public: true
        JoliCode\SecretSanta\Tests\Fake\FakeWebexApi:
            public: true
        JoliCode\SecretSanta\Tests\Fake\FakeChatApiDispatcher:
            arguments:
                - '@JoliCode\SecretSanta\Tests\Fake\FakeSlackApi'
                - '@JoliCode\SecretSanta\Tests\Fake\FakeDiscordApi'
                - '@JoliCode\SecretSanta\Tests\Fake\FakeWebexApi'

        test.session.storage.factory.mock_file:
            alias: session.storage.factory.mock_file
            public: true
